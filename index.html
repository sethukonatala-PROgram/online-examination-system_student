<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExamPulse | Computer Science Assessment & Online Examination System</title>
  <meta name="description" content="ExamPulse is an enterprise online examination and CBT assessment portal with auto-proctoring, question palettes, and verified certificate generation.">
  <meta name="author" content="Department of Computer Science & Engineering">
  <meta name="theme-color" content="#2563eb">

  <!-- Core Professional Stylesheets -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/certificate.css">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563eb'><path d='M9 11l3 3L22 4M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11'/></svg>">
</head>
<body>

  <!-- Top Enterprise Header -->
  <header class="app-header no-print">
    <div class="header-left">
      <div class="brand-badge" id="brand-home-link">
        <div class="brand-icon">✓</div>
        <span>ExamPulse</span>
      </div>
      <div class="institution-tag">Dept. of Computer Science & Engineering</div>

      <nav class="header-nav">
        <button class="header-nav-btn active" data-view="dashboard">Assessment Catalog</button>
        <button class="header-nav-btn" data-view="admin">Faculty Console & Leaderboard</button>
      </nav>
    </div>

    <div class="header-right">
      <!-- Active Exam Status Indicators (Visible during test) -->
      <div id="header-exam-pills" style="display: none; align-items: center; gap: 0.75rem;">
        <div class="proctor-pill" id="proctor-status-pill">
          <span class="proctor-dot"></span>
          <span>Proctoring Active</span>
          <span style="border-left: 1px solid rgba(22, 163, 74, 0.4); padding-left: 0.4rem; color: var(--text-main);" id="proctor-strike-count">0 / 3 Strikes</span>
        </div>

        <div class="timer-pill" id="header-timer-pill">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span id="header-timer-val">15:00</span>
        </div>
      </div>

      <!-- Theme Toggle -->
      <button class="icon-btn" id="btn-theme-toggle" title="Toggle Theme" aria-label="Toggle Theme">
        🌙
      </button>

      <!-- User Profile Badge -->
      <div class="user-pill">
        <div class="user-avatar-sm">AM</div>
        <span style="color: var(--text-main);">Alex Mercer</span>
      </div>
    </div>
  </header>

  <!-- Main View Container -->
  <main class="app-body" id="app-content">
    <!-- Rendered dynamically by app.js -->
  </main>

  <!-- Modal: Confirm Assessment Submission -->
  <div class="modal-overlay" id="submit-confirm-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 style="font-size: 1.15rem; font-weight: 700;">Final Assessment Submission</h3>
        <button class="icon-btn modal-close-btn" style="width: 30px; height: 30px;">✕</button>
      </div>
      <div class="modal-body">
        <p id="submit-modal-summary" style="font-size: 0.92rem; line-height: 1.6; color: var(--text-main);">
          Are you sure you want to submit your assessment?
        </p>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary modal-close-btn">Resume Test</button>
        <button class="btn-success" id="btn-modal-confirm-submit">Yes, Submit Final Responses</button>
      </div>
    </div>
  </div>

  <!-- Modal: Create Assessment (Faculty Console) -->
  <div class="modal-overlay" id="create-exam-modal">
    <div class="modal-card" style="max-width: 580px;">
      <div class="modal-header">
        <h3 style="font-size: 1.15rem; font-weight: 700;">Create Computer Science Assessment</h3>
        <button class="icon-btn modal-close-btn" style="width: 30px; height: 30px;">✕</button>
      </div>
      <form id="create-exam-form">
        <div class="modal-body" style="display: flex; flex-direction: column; gap: 1rem;">
          <div>
            <label style="display: block; font-size: 0.82rem; font-weight: 700; margin-bottom: 0.35rem;">Course Code *</label>
            <input type="text" name="examCode" required placeholder="e.g. CS205" style="width: 100%; padding: 0.6rem; border: 1px solid var(--border); border-radius: var(--radius-sm);">
          </div>
          <div>
            <label style="display: block; font-size: 0.82rem; font-weight: 700; margin-bottom: 0.35rem;">Assessment Title *</label>
            <input type="text" name="examTitle" required placeholder="e.g. Computer Networks Protocol Midterm" style="width: 100%; padding: 0.6rem; border: 1px solid var(--border); border-radius: var(--radius-sm);">
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div>
              <label style="display: block; font-size: 0.82rem; font-weight: 700; margin-bottom: 0.35rem;">Duration (Minutes) *</label>
              <input type="number" name="examDuration" value="15" min="1" max="180" style="width: 100%; padding: 0.6rem; border: 1px solid var(--border); border-radius: var(--radius-sm);">
            </div>
            <div>
              <label style="display: block; font-size: 0.82rem; font-weight: 700; margin-bottom: 0.35rem;">Max Marks *</label>
              <input type="number" name="examMarks" value="20" min="5" max="100" style="width: 100%; padding: 0.6rem; border: 1px solid var(--border); border-radius: var(--radius-sm);">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-secondary modal-close-btn">Cancel</button>
          <button type="submit" class="btn-primary">Publish Assessment</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Application Logic -->
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
